---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - webapp.ferh6t.github.io
  resources:
  - droplets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - webapp.ferh6t.github.io
  resources:
  - droplets/finalizers
  verbs:
  - update
- apiGroups:
  - webapp.ferh6t.github.io
  resources:
  - droplets/status
  verbs:
  - get
  - patch
  - update
