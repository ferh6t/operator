---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - webapp.ferh6t.github.io
  resources:
  - droplets
  - postgresclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - webapp.ferh6t.github.io
  resources:
  - droplets/finalizers
  - postgresclusters/finalizers
  verbs:
  - update
- apiGroups:
  - webapp.ferh6t.github.io
  resources:
  - droplets/status
  - postgresclusters/status
  verbs:
  - get
  - patch
  - update
