---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: postgresclusters.webapp.ferh6t.github.io
spec:
  group: webapp.ferh6t.github.io
  names:
    kind: PostgresCluster
    listKind: PostgresClusterList
    plural: postgresclusters
    shortNames:
    - pgc
    singular: postgrescluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Members
      type: integer
    - jsonPath: .status.readyMembers
      name: Ready
      type: integer
    - jsonPath: .status.primary
      name: Primary
      type: string
    - jsonPath: .spec.postgresVersion
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresCluster runs a Patroni-managed PostgreSQL cluster, backed by etcd,
          on DigitalOcean Droplets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PostgresCluster
            properties:
              allowedSourceRanges:
                description: |-
                  allowedSourceRanges are the CIDRs allowed to connect to PostgreSQL with a
                  password. Defaults to the DigitalOcean private network (10.0.0.0/8).
                  Add "0.0.0.0/0" to allow connections from anywhere.
                items:
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                  - message: must be a CIDR, e.g. 10.0.0.0/8
                    rule: isCIDR(self)
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              droplet:
                description: |-
                  droplet describes every Droplet of the cluster. Each one is named
                  <cluster-name>-<index>. spec.name and spec.userData are ignored: the
                  controller sets cloud-init itself to install its SSH key.
                  The image must be Ubuntu 24.04 (ubuntu-24-04-x64).
                properties:
                  backups:
                    description: backups enables automated backups.
                    type: boolean
                  image:
                    description: image slug or numeric image ID, e.g. "ubuntu-24-04-x64".
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: image is immutable
                      rule: self == oldSelf
                  ipv6:
                    description: ipv6 enables IPv6 networking.
                    type: boolean
                  monitoring:
                    description: monitoring installs the DigitalOcean monitoring agent.
                    type: boolean
                  name:
                    description: name is the hostname of the Droplet. Defaults to
                      metadata.name when empty.
                    maxLength: 255
                    pattern: ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$
                    type: string
                  region:
                    description: region slug where the Droplet is created, e.g. "nyc3",
                      "fra1", "ams3".
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: region is immutable
                      rule: self == oldSelf
                  size:
                    description: size slug of the Droplet, e.g. "s-1vcpu-1gb".
                    minLength: 1
                    type: string
                  sshKeys:
                    description: sshKeys is a list of SSH key IDs or fingerprints
                      to embed in the Droplet.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  tags:
                    description: tags applied to the Droplet.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  tokenSecretRef:
                    description: tokenSecretRef references the Secret holding the
                      DigitalOcean API token.
                    properties:
                      key:
                        default: token
                        description: key inside the Secret that holds the value.
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  userData:
                    description: userData is cloud-init data passed to the Droplet
                      on first boot.
                    maxLength: 65536
                    type: string
                  volumes:
                    description: volumes is a list of block storage volume IDs to
                      attach.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  vpcUUID:
                    description: vpcUUID is the VPC to place the Droplet in. Uses
                      the region default VPC when empty.
                    type: string
                required:
                - image
                - region
                - size
                - tokenSecretRef
                type: object
              postgresVersion:
                default: "16"
                description: postgresVersion is the PostgreSQL major version to install.
                enum:
                - "14"
                - "15"
                - "16"
                - "17"
                type: string
                x-kubernetes-validations:
                - message: postgresVersion is immutable
                  rule: self == oldSelf
              replicas:
                default: 3
                description: |-
                  replicas is the number of Droplets (cluster members). It must be odd so
                  etcd keeps a quorum when one member is down. Change it only while the
                  cluster is Running: new members are added one at a time, and removed
                  members go highest number first, after the primary has moved away.
                format: int32
                maximum: 7
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: replicas must be odd so etcd keeps a quorum
                  rule: self % 2 == 1
            required:
            - droplet
            type: object
          status:
            description: status defines the observed state of PostgresCluster
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the PostgresCluster.
                  Types: "Available", "Progressing", "Degraded", and "Initialized"
                  (True once every member has been running).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecret:
                description: |-
                  credentialsSecret is the Secret holding the PostgreSQL passwords
                  (keys: username, password, replication-password).
                type: string
              lastHealthCheck:
                description: lastHealthCheck is when the controller last checked etcd
                  and Patroni.
                format: date-time
                type: string
              members:
                description: members of the cluster.
                items:
                  description: |-
                    PostgresMember is one Droplet of the cluster, as seen by the controller
                    and reported by Patroni.
                  properties:
                    etcdHealthy:
                      description: |-
                        etcdHealthy is whether this member's etcd answered the last health check.
                        Empty until etcd has been checked.
                      type: boolean
                    hostKey:
                      description: |-
                        hostKey is the SHA256 fingerprint of the Droplet's SSH host key, recorded
                        on first connect. Later connections must present the same key.
                      type: string
                    lagBytes:
                      description: lagBytes is the replication lag in bytes. Empty
                        for the leader.
                      format: int64
                      type: integer
                    name:
                      description: name of the member, equal to its Droplet name.
                      type: string
                    privateIPv4:
                      description: privateIPv4 is the address etcd, Patroni and replication
                        use.
                      type: string
                    publicIPv4:
                      description: publicIPv4 is the address the controller connects
                        to over SSH.
                      type: string
                    role:
                      description: 'role reported by Patroni: leader, replica, sync_standby.'
                      type: string
                    state:
                      description: 'state reported by Patroni: running, streaming,
                        starting, stopped.'
                      type: string
                    timeline:
                      description: |-
                        timeline is the PostgreSQL timeline Patroni reports. It goes up by one
                        on every failover.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the most recent generation the
                  controller acted on.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is a short summary: Provisioning, Installing, Bootstrapping,
                  Running, Scaling or Degraded.
                type: string
              primary:
                description: primary is the name of the member that currently accepts
                  writes.
                type: string
              readyMembers:
                description: readyMembers is the number of members PostgreSQL reports
                  as running.
                format: int32
                type: integer
              runningReplicas:
                description: |-
                  runningReplicas is spec.replicas the last time every member was
                  running. While it differs from spec.replicas the cluster is scaling.
                format: int32
                type: integer
              sshSecret:
                description: |-
                  sshSecret is the Secret holding the SSH key the controller uses to
                  reach the Droplets (type kubernetes.io/ssh-auth).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.readyMembers
      status: {}
