                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createdAt:
                description: createdAt is when DigitalOcean created the Droplet.
                format: date-time
                type: string
              id:
                description: id is the DigitalOcean Droplet ID.
                type: integer
              observedGeneration:
                description: observedGeneration is the most recent generation the
                  controller acted on.
                format: int64
                type: integer
              privateIPv4:
                description: privateIPv4 address of the Droplet.
                type: string
              publicIPv4:
                description: publicIPv4 address of the Droplet.
                type: string
              publicIPv6:
                description: publicIPv6 address of the Droplet.
                type: string
              state:
                description: 'state reported by DigitalOcean: new, active, off, archive.'
