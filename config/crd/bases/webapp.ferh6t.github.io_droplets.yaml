    name: v1
    schema:
      openAPIV3Schema:
        description: Droplet is a DigitalOcean Droplet managed from Kubernetes
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Droplet
            properties:
              backups:
                description: backups enables automated backups.
                type: boolean
              image:
                description: image slug or numeric image ID, e.g. "ubuntu-24-04-x64".
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: image is immutable
                  rule: self == oldSelf
              ipv6:
                description: ipv6 enables IPv6 networking.
                type: boolean
              monitoring:
                description: monitoring installs the DigitalOcean monitoring agent.
                type: boolean
              name:
                description: name is the hostname of the Droplet. Defaults to metadata.name
                  when empty.
                maxLength: 255
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$
                type: string
              region:
                description: region slug where the Droplet is created, e.g. "nyc3",
                  "fra1", "ams3".
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              size:
                description: size slug of the Droplet, e.g. "s-1vcpu-1gb".
                minLength: 1
                type: string
              sshKeys:
                description: sshKeys is a list of SSH key IDs or fingerprints to embed
                  in the Droplet.
