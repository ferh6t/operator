    controller-gen.kubebuilder.io/version: v0.22.0
  name: droplets.webapp.ferh6t.github.io
spec:
  group: webapp.ferh6t.github.io
  names:
    kind: Droplet
    listKind: DropletList
    plural: droplets
    shortNames:
    - do
    singular: droplet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.size
      name: Size
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.publicIPv4
