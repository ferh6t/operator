apiVersion: webapp.ferh6t.github.io/v1
kind: Droplet
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: droplet-sample
spec:
  region: fra1
  size: s-1vcpu-1gb
  image: ubuntu-24-04-x64
  # Filled from .env by `make apply-sample`
  sshKeys: ${DO_SSH_KEYS}
  ipv6: true
  monitoring: true
  tags:
    - k8s-managed
  userData: |
    #cloud-config
    packages:
      - nginx
  tokenSecretRef:
    name: digitalocean-token
    key: token
